name: Sugerir uma melhoria
description: Proponha uma melhoria de facilidade de uso, acessibilidade ou funcionalidade.
title: "[Sugestão] "
body:
  - type: markdown
    attributes:
      value: |
        O projeto é gratuito e em português brasileiro. Este relato é público; não inclua credenciais ou dados pessoais.
        Consulte as sugestões existentes antes de abrir outra.
  - type: textarea
    id: problem
    attributes:
      label: Qual dificuldade ou necessidade você encontrou?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Qual melhoria você sugere?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Categoria
      options:
        - Facilidade de uso
        - Acessibilidade
        - Gerenciamento de mods
        - Atualização e recuperação
        - Site e documentação
        - Outro
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional (opcional)
      description: Exemplo de uso, resolução ou captura revisada; nunca envie dados privados.
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmação
      options:
        - label: Revisei o conteúdo e não incluí credenciais, dados pessoais ou arquivos privados.
          required: true