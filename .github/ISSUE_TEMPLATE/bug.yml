name: Relatar um bug
description: Informe uma falha reproduzível no Gerenciador de Dedicado.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Este relato é público. Nunca publique chaves Steam, tokens Klei, senhas, IPs privados, arquivos de mundo ou logs completos sem revisão.
        Pesquise relatos existentes antes de abrir um novo. Faça testes em um mundo descartável.
  - type: input
    id: build
    attributes:
      label: Build do aplicativo
      description: Informe o identificador exibido na release baixada.
      placeholder: "1.0.0-build-..."
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Arquitetura do executável
      options:
        - Windows x64
        - Windows x86
        - Windows ARM64
        - Não sei
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: "Windows 11, Windows 10..."
  - type: dropdown
    id: task
    attributes:
      label: Onde ocorreu?
      options:
        - Detecção e seleção de mundos
        - Gerenciamento de mods / Workshop
        - Atualização SteamCMD
        - Diagnóstico ou backups
        - Interface / acessibilidade
        - Outro
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Descreva os passos, sem divulgar dados pessoais.
      placeholder: "1. Abra...\n2. Selecione...\n3. Ocorre..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Resultado observado
      description: Mensagem de erro e captura revisada, se necessário. Não anexe credenciais ou arquivos privados.
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Resolução, escala e recurso de acessibilidade (opcional)
      placeholder: "1366x768, 150%, Narrador..."
  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmação
      options:
        - label: Revisei o conteúdo e não incluí credenciais, dados pessoais ou arquivos privados.
          required: true