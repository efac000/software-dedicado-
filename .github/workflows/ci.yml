name: CI Windows
on:
  push:
    branches: [main, implementacao-1.0.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/CoreTests -c Release
      - run: dotnet publish src/App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts
      - name: Check executable and hash
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/Gerenciador-de-Dedicado.exe)) { throw 'Executável ausente' }
          (Get-FileHash artifacts/Gerenciador-de-Dedicado.exe -Algorithm SHA256).Hash + '  Gerenciador-de-Dedicado.exe' | Set-Content artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gerenciador-de-Dedicado-1.0.0
          path: |
            artifacts/Gerenciador-de-Dedicado.exe
            artifacts/SHA256.txt
          if-no-files-found: error
