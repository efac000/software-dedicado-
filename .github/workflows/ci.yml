name: CI Windows
on:
  push:
    branches: [main, implementacao-1.0.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/CoreTests -c Release
      - run: dotnet run --project tests/AccessibilityTests -c Release
        env:
          GDD_QA_CAPTURE_DIR: ${{ github.workspace }}/qa-captures
      - name: Archive rendered UI fixture
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: UI-review-fixture
          path: qa-captures/*.png
          if-no-files-found: warn
      - name: Build portable Windows packages
        shell: pwsh
        run: |
          foreach ($arch in @('x64','x86','arm64')) {
            dotnet publish src/App -c Release -r "win-$arch" --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o "artifacts/$arch"
            if ($LASTEXITCODE -ne 0) { throw "Build $arch falhou" }
          }
          $test = Start-Process -FilePath (Resolve-Path 'artifacts/x64/Gerenciador-de-Dedicado.exe') -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw 'Smoke test x64 falhou' }
          $test = Start-Process -FilePath (Resolve-Path 'artifacts/x86/Gerenciador-de-Dedicado.exe') -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw 'Smoke test x86 falhou' }
          foreach ($arch in @('x64','x86')) {
            $ui = Start-Process -FilePath (Resolve-Path "artifacts/$arch/Gerenciador-de-Dedicado.exe") -ArgumentList '--self-test-ui' -PassThru -Wait
            if ($ui.ExitCode -ne 0) { throw "Smoke de janela e icone $arch falhou" }
          }
      - name: Check executable and hash
        shell: pwsh
        run: |
          foreach ($arch in @('x64','x86','arm64')) {
            $exe = "artifacts/$arch/Gerenciador-de-Dedicado.exe"
            if (!(Test-Path $exe)) { throw "Executável $arch ausente" }
            powershell -NoProfile -ExecutionPolicy Bypass -File tests/VerifyIcon.ps1 -Exe $exe -SourceIcon src/App/Parafuso.ico -Arch $arch
            if ($LASTEXITCODE -ne 0) { throw "Icone ou arquitetura $arch divergente" }
            $name = if ($arch -eq 'x64') {'Gerenciador-de-Dedicado.exe'} else {"Gerenciador-de-Dedicado-$arch.exe"}
            Move-Item $exe "artifacts/$name"
          }
          Get-ChildItem artifacts/*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name } | Set-Content artifacts/SHA256.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Gerenciador-de-Dedicado-1.0.0
          path: |
            artifacts/*.exe
            artifacts/SHA256.txt
          if-no-files-found: error

  arm64-smoke:
    needs: test-build
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Gerenciador-de-Dedicado-1.0.0
          path: qa
      - name: Run the exact ARM64 artifact
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64') { throw 'Runner nao e ARM64' }
          $exe = Get-Item 'qa/Gerenciador-de-Dedicado-arm64.exe'
          $expected = (Get-Content qa/SHA256.txt | Where-Object { $_ -match ' Gerenciador-de-Dedicado-arm64\.exe$' })
          if (@($expected).Count -ne 1 -or ($expected -split '\s+')[0] -ne (Get-FileHash $exe.FullName -Algorithm SHA256).Hash) { throw 'Hash ARM64 divergente' }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Autoteste ARM64 falhou' }
          $ui = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test-ui' -Wait -PassThru
          if ($ui.ExitCode -ne 0) { throw 'Smoke de janela ARM64 falhou' }
          Write-Host "ARM64 nativo executado no SHA $env:GITHUB_SHA; exit 0"
