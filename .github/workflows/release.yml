name: Publicar revisão candidata
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/CoreTests -c Release
      - run: dotnet publish src/App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts
      - name: Publish candidate with immutable revision tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = 'artifacts/Gerenciador-de-Dedicado.exe'
          if (!(Test-Path $exe)) { throw 'Executável ausente' }
          (Get-FileHash $exe -Algorithm SHA256).Hash + '  Gerenciador-de-Dedicado.exe' | Set-Content artifacts/SHA256.txt
          $tag = "1.0.0-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag $exe artifacts/SHA256.txt --target $env:GITHUB_SHA --title "Gerenciador de Dedicado 1.0.0 — build $env:GITHUB_RUN_NUMBER" --prerelease --notes "Candidata a validação. Teste primeiro em cluster descartável. Executável Windows x64 não assinado. Versão pública fixa 1.0.0."
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release' }
