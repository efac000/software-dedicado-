name: Publicar revisão candidata
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test-build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/CoreTests -c Release
      - run: dotnet run --project tests/AccessibilityTests -c Release
      - name: Build portable Windows packages
        shell: pwsh
        run: |
          foreach ($arch in @('x64','x86','arm64')) {
            dotnet publish src/App -c Release -r "win-$arch" --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:BuildTag="1.0.0-build-${{ github.run_id }}-${{ github.run_attempt }}" -o "artifacts/$arch"
            if ($LASTEXITCODE -ne 0) { throw "Build $arch falhou" }
          }
          $test = Start-Process -FilePath (Resolve-Path 'artifacts/x64/Gerenciador-de-Dedicado.exe') -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw 'Smoke test x64 falhou' }
          $test = Start-Process -FilePath (Resolve-Path 'artifacts/x86/Gerenciador-de-Dedicado.exe') -ArgumentList '--self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw 'Smoke test x86 falhou' }
          foreach ($arch in @('x64','x86')) {
            $ui = Start-Process -FilePath (Resolve-Path "artifacts/$arch/Gerenciador-de-Dedicado.exe") -ArgumentList '--self-test-ui' -PassThru -Wait
            if ($ui.ExitCode -ne 0) { throw "Smoke de janela e icone $arch falhou" }
          }
      - name: Check executable and hash
        shell: pwsh
        run: |
          foreach ($arch in @('x64','x86','arm64')) {
            $exe = "artifacts/$arch/Gerenciador-de-Dedicado.exe"
            if (!(Test-Path $exe)) { throw "Executável $arch ausente" }
            powershell -NoProfile -ExecutionPolicy Bypass -File tests/VerifyIcon.ps1 -Exe $exe -SourceIcon src/App/Parafuso.ico -Arch $arch
            if ($LASTEXITCODE -ne 0) { throw "Icone ou arquitetura $arch divergente" }
            $name = if ($arch -eq 'x64') {'Gerenciador-de-Dedicado.exe'} else {"Gerenciador-de-Dedicado-$arch.exe"}
            Move-Item $exe "artifacts/$name"
          }
          Get-ChildItem artifacts/*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash + '  ' + $_.Name } | Set-Content artifacts/SHA256.txt
          "1.0.0-build-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" | Set-Content artifacts/BuildTag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Gerenciador-de-Dedicado-1.0.0
          path: |
            artifacts/*.exe
            artifacts/SHA256.txt
            artifacts/BuildTag.txt
          if-no-files-found: error

  arm64-smoke:
    needs: test-build
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Gerenciador-de-Dedicado-1.0.0
          path: qa
      - name: Run the exact ARM64 artifact
        shell: pwsh
        run: |
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -ne 'Arm64') { throw 'Runner nao e ARM64' }
          $exe = Get-Item 'qa/Gerenciador-de-Dedicado-arm64.exe'
          $expected = (Get-Content qa/SHA256.txt | Where-Object { $_ -match ' Gerenciador-de-Dedicado-arm64\.exe$' })
          if (@($expected).Count -ne 1 -or ($expected -split '\s+')[0] -ne (Get-FileHash $exe.FullName -Algorithm SHA256).Hash) { throw 'Hash ARM64 divergente' }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Autoteste ARM64 falhou' }
          $ui = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test-ui' -Wait -PassThru
          if ($ui.ExitCode -ne 0) { throw 'Smoke de janela ARM64 falhou' }
          Write-Host "ARM64 nativo executado no SHA $env:GITHUB_SHA; exit 0"

  publish:
    needs: [test-build, arm64-smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Gerenciador-de-Dedicado-1.0.0
          path: artifacts
      - name: Verify and publish the tested artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $names = @('Gerenciador-de-Dedicado.exe','Gerenciador-de-Dedicado-x86.exe','Gerenciador-de-Dedicado-arm64.exe')
          $assets = @(Get-ChildItem artifacts/*.exe | ForEach-Object FullName)
          if ($assets.Count -ne 3) { throw 'Pacotes incompletos' }
          $hashes = @(Get-Content artifacts/SHA256.txt)
          if ($hashes.Count -ne 3) { throw 'Manifesto incompleto' }
          foreach ($name in $names) {
            $expected = @($hashes | Where-Object { $_ -match ('\s+' + [regex]::Escape($name) + '$') })
            if ($expected.Count -ne 1 -or ($expected[0] -split '\s+')[0] -ne (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash) { throw "Hash divergente: $name" }
          }
          $tag = (Get-Content artifacts/BuildTag.txt -Raw).Trim()
          if ($tag -notmatch ("^1\.0\.0-build-" + [regex]::Escape($env:GITHUB_RUN_ID) + "-\d+$")) { throw 'Identificador de build divergente' }
          gh release create $tag @assets artifacts/SHA256.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Gerenciador de Dedicado 1.0.0 - build $env:GITHUB_RUN_NUMBER" --prerelease --notes "Candidata a validacao. Teste primeiro em cluster descartavel. Windows x64, x86 e ARM64: os executaveis passaram nos autotestes e nos testes de janela; ARM64 foi executado em runner nativo. Pacotes sem assinatura Authenticode. Versao publica fixa 1.0.0."
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release' }
