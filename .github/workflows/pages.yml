name: Site de download
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url || steps.final_deployment.outputs.page_url }}
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        id: upload
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: docs
      - name: Confirm artifact is visible before deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" 2>/dev/null); then
              if jq -e --arg name "$PAGES_ARTIFACT" --arg id "$EXPECTED_ID" '[.artifacts[] | select(.name == $name and (.id|tostring)==$id and .expired==false)] | length == 1' <<< "$result" >/dev/null; then
                echo "Verified artifact $PAGES_ARTIFACT"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Uploaded Pages artifact not visible within the retry window."
          exit 1
      - name: Allow artifact metadata to propagate
        run: sleep 20
      - uses: actions/deploy-pages@v5.0.1
        id: deployment
        continue-on-error: true
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - uses: actions/deploy-pages@v5.0.1
        id: retry_deployment
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait before final deployment attempt
        if: steps.retry_deployment.outcome == 'failure'
        run: sleep 45
      - uses: actions/deploy-pages@v5.0.1
        id: final_deployment
        if: steps.retry_deployment.outcome == 'failure'
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
      - name: Verify public download link
        shell: bash
        run: |
          set -euo pipefail
          expected=$(sed -n 's/.*id="download"[^>]*href="\([^"]*\)".*/\1/p' docs/index.html)
          test -n "$expected"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 20 "https://efac000.github.io/software-dedicado-/?verify=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/public-site.html" && grep -Fq "$expected" "$RUNNER_TEMP/public-site.html"; then
              echo "PUBLIC_SITE_DOWNLOAD_PASS $expected"
              exit 0
            fi
            sleep 8
          done
          echo "::error::The public page does not yet contain the expected download."
          exit 1
