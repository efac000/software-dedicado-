name: Atualizar download verificado 45704640329
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-download-45704640329.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: finalize-download-45704640329
  cancel-in-progress: false
jobs:
  verify-and-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN: '45704640329'
      CI_RUN: '45704640412'
      EXPECTED_SHA: '0e72320b9ca7f9d8ead5c090e482d5f6f2051b9a'
      RELEASE_TAG: '1.0.0-build-45704640329-1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify exact release and CI runs
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            all_done=true
            for run in "$RELEASE_RUN" "$CI_RUN"; do
              result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
              jq -e --arg sha "$EXPECTED_SHA" '.head_sha == $sha and .head_branch == "main"' <<< "$result" >/dev/null
              if [[ $(jq -r .status <<< "$result") == completed ]]; then
                jq -e '.conclusion == "success"' <<< "$result" >/dev/null
              else
                all_done=false
              fi
            done
            if [[ "$all_done" == true ]]; then exit 0; fi
            sleep 5
          done
          echo "::error::Exact release/CI runs did not complete within the verification window."
          exit 1
      - name: Download and independently verify public binaries
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          jq -e '.draft == false and (.assets | length == 4)' "$RUNNER_TEMP/release.json" >/dev/null
          [[ $(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha) == "$EXPECTED_SHA" ]]
          mkdir -p "$RUNNER_TEMP/gdd-release"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/gdd-release"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          release = json.loads((root / "release.json").read_text())
          directory = root / "gdd-release"
          names = {"Gerenciador-de-Dedicado.exe", "Gerenciador-de-Dedicado-x86.exe", "Gerenciador-de-Dedicado-arm64.exe"}
          assets = {a["name"]: a for a in release["assets"]}
          assert set(assets) == names | {"SHA256.txt"}
          hashes = {}
          for line in (directory / "SHA256.txt").read_text(encoding="utf-8-sig").splitlines():
              match = re.fullmatch(r"([0-9A-Fa-f]{64})\s+(.+)", line)
              assert match and match[2] not in hashes
              hashes[match[2]] = match[1].lower()
          assert set(hashes) == names
          for name in names | {"SHA256.txt"}:
              p = directory / name
              assert p.stat().st_size == assets[name]["size"]
              with p.open("rb") as f:
                  digest = hashlib.file_digest(f, "sha256").hexdigest()
              assert assets[name]["digest"] == "sha256:" + digest
              if name in names:
                  assert hashes[name] == digest
              print("DOWNLOAD_SHA256_PASS", name)
          PY
      - name: Update download page only after verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git merge-base --is-ancestor "$EXPECTED_SHA" HEAD
          git diff --quiet "$EXPECTED_SHA" HEAD -- src tests .github/workflows/release.yml
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ["RELEASE_TAG"]
          p = pathlib.Path("docs/index.html")
          s = p.read_text(encoding="utf-8")
          if tag in s:
              assert s.count(tag) == 5
              print("Already updated")
              raise SystemExit(0)
          old = "1.0.0-build-45685079390-1"
          candidate = "1.0.0-build-45700323953-1"
          assert s.count(old) == 5 and s.count(candidate) == 5
          s = s.replace(old, tag)
          s = s.replace("Build estável 45685079390-1 — Interface modernizada",
                        "Build 45704640329-1 — revisão recomendada (pré-release verificada)")
          s, count = re.subn(r'<div class="notice candidate-download">[\s\S]*?</div>\s*</div>',
              '<div class="notice candidate-download">\n'
              '      <h3>Revisão atualizada e verificada</h3>\n'
              '      <p>Inclui navegação lateral corrigida em Diagnóstico e Backups, preferências seguras e correção visual. Testes de núcleo e interface aprovados; x64, x86 e ARM64 verificados. A homologação online da base foi aprovada. Outras escalas reais de DPI ainda não foram verificadas.</p>\n'
              '      <div class="download-links">\n'
              '        <a href="https://github.com/efac000/software-dedicado-/releases/tag/1.0.0-build-45685079390-1">Versão estável anterior</a>\n'
              '        <a href="https://github.com/efac000/software-dedicado-/actions/runs/45704640329">Evidências dos testes e publicação</a>\n'
              '      </div>\n    </div>', s)
          assert count == 1 and s.count(tag) == 5 and candidate not in s and 'id="interface"' not in s
          p.write_text(s, encoding="utf-8")
          PY
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- docs/index.html
            git commit -m "Atualizar download recomendado para revisão verificada 45704640329"
            git push origin HEAD:main
          fi
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
